# workflow for building and deploying to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Triggered by the audit reports repo when reports change
  repository_dispatch:
    types: [rebuild-reports]
  # Dagelijkse publicatie van de WCAG LinkedIn-serie: geeft één draft vrij
  # en deployt die in dezelfde run (zie de "Publiceer volgende SC-post"-stap).
  schedule:
    - cron: "0 6 * * *" # elke dag 06:00 UTC (08:00 NL zomertijd)
  # Handmatig starten kan ook
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# contents: write is nodig om de vrijgegeven draft terug te committen naar main.
permissions:
  contents: write
  pages: write
  id-token: write

# Default to bash
defaults:
  run:
    shell: bash

# Environment variables available to all jobs and steps in this workflow
env:
  HUGO_ENV: production
  HUGO_VERSION: "0.151.0"
  TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-arm64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      # Geeft bij de dagelijkse cron-run één SC-serie-draft vrij en commit dat
      # terug naar main. De build hieronder pakt de vrijgegeven post meteen mee,
      # dus publiceren en deployen gebeuren in dezelfde run.
      - name: Publiceer volgende SC-post (alleen bij schedule/handmatig)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/publish_next_linkedin_post.py | tee /tmp/pub.txt
          if grep -q '^PUBLISHED ' /tmp/pub.txt; then
            slug="$(sed -n 's/^PUBLISHED //p' /tmp/pub.txt)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "content: publiceer SC-serie post ${slug} [scheduled]"
            git push origin HEAD:main
          else
            echo "Niets te publiceren vandaag."
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup Project
        run: npm run project-setup

      - name: Install npm dependencies
        run: npm install

      # Herbouwt het rapportoverzicht (static/rapporten/index.html) uit de
      # aanwezige rapportmappen. Zo verschijnt elk nieuw rapport dat onder
      # static/rapporten/<slug>/ is gecommit automatisch op het overzicht,
      # zonder dat de kaart handmatig hoeft te worden toegevoegd. Draait
      # in-place vóór de Hugo-build (geen commit terug naar de repo).
      - name: Genereer rapportoverzicht
        run: python3 scripts/generate_rapporten_index.py

      # Rapporten mogen niet in de zoekmachines staan. Dat regelen we met een noindex
      # in de <head> van elke rapportpagina; zie de toelichting in static/robots.txt.
      # De generator van pa-audit zet die niet overal neer, dus de build faalt liever
      # dan dat er een rapport zonder noindex live gaat.
      - name: Controleer noindex op de rapporten
        run: python3 scripts/check_rapporten_noindex.py

      - name: Build site
        run: npm run build

      # --- Audit reports → /rapporten/ ---
      # Sinds 26-06-2026 worden auditrapporten als static asset bijgehouden in
      # deze repo onder `static/rapporten/<slug>/` (Hugo serveert die verbatim).
      # De oude route (pa-audit checkout via Git LFS + rsync) is verwijderd: het
      # LFS-budget van pa-audit raakte op, de fetch faalde bij elke build en de
      # stap was `continue-on-error`, waardoor nieuwe rapporten stilletjes niet
      # live kwamen. Publiceren gaat nu via een commit naar static/rapporten/.
      # Zie de auditpijplijn-playbook in ~/git/ProperAccess.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-arm
    needs: build
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      # Leegt de Cloudflare-cache zodat vervangen bestanden (zelfde naam, bv.
      # foto's, CSS) meteen vers worden geserveerd. Wordt overgeslagen zolang
      # het secret CLOUDFLARE_API_TOKEN nog niet is ingesteld.
      - name: Purge Cloudflare cache
        if: env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      # IndexNow nudge voor Bing/Copilot (ChatGPT-search leunt op de Bing-index).
      # De key is publiek (gepubliceerd op /<key>.txt), dus geen secret.
      #
      # Stuurt de URL's die de afgelopen 3 dagen zijn gewijzigd, afgeleid uit de
      # lastmod in de sitemaps. Dat werkt alleen goed met enableGitInfo in
      # hugo.toml: zonder dat is lastmod gelijk aan de publicatiedatum en wordt
      # gewijzigde content nooit gemeld. Het venster is 3 dagen zodat een
      # overgeslagen of mislukte deploy niet betekent dat een pagina helemaal
      # niet wordt ingestuurd.
      #
      # De sitemaps worden over HTTP van de live site gehaald, niet uit public/:
      # deze stap draait in de deploy-job en die heeft geen checkout en geen
      # build-output. Bijkomend voordeel is dat we alleen insturen wat er
      # werkelijk gepubliceerd staat.
      #
      # De Google sitemap-ping die hier stond is verwijderd: dat endpoint is in
      # juni 2023 uitgezet en gaf stilzwijgend niets terug.
      - name: Ping IndexNow (Bing/Copilot)
        run: |
          sleep 15  # even wachten tot Pages en de Cloudflare-purge doorwerken
          python3 - <<'PY' > /tmp/indexnow.json
          import json, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          INDEX = "https://www.properaccess.nl/sitemap.xml"
          cutoff = datetime.now(timezone.utc) - timedelta(days=3)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "properaccess-deploy"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return ET.fromstring(r.read())

          urls = []
          try:
              root = fetch(INDEX)
              if root.tag.endswith("sitemapindex"):
                  children = [s.findtext("sm:loc", namespaces=NS) for s in root.findall("sm:sitemap", NS)]
              else:
                  children = [INDEX]
              for child in filter(None, children):
                  for url in fetch(child).findall("sm:url", NS):
                      loc = url.findtext("sm:loc", namespaces=NS)
                      mod = url.findtext("sm:lastmod", namespaces=NS)
                      if not loc or not mod:
                          continue
                      try:
                          if datetime.fromisoformat(mod) >= cutoff:
                              urls.append(loc)
                      except ValueError:
                          continue
          except Exception as e:  # een mislukte ping mag de deploy niet laten falen
              print(f"sitemap ophalen mislukt: {e}", file=__import__("sys").stderr)

          urls = sorted(set(urls))[:10000]
          print(json.dumps({
              "host": "www.properaccess.nl",
              "key": "4da3b6cd119f757a090fc80e4ce46fd2",
              "keyLocation": "https://www.properaccess.nl/4da3b6cd119f757a090fc80e4ce46fd2.txt",
              "urlList": urls,
          }))
          PY
          count=$(python3 -c "import json;print(len(json.load(open('/tmp/indexnow.json'))['urlList']))")
          echo "IndexNow: $count gewijzigde URL's"
          if [ "$count" -gt 0 ]; then
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" --data @/tmp/indexnow.json
          fi
