# workflow for building and deploying to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Triggered by the audit reports repo when reports change
  repository_dispatch:
    types: [rebuild-reports]
  # Dagelijkse publicatie van de WCAG LinkedIn-serie: geeft één draft vrij
  # en deployt die in dezelfde run (zie de "Publiceer volgende SC-post"-stap).
  schedule:
    - cron: "0 6 * * *" # elke dag 06:00 UTC (08:00 NL zomertijd)
  # Handmatig starten kan ook
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# contents: write is nodig om de vrijgegeven draft terug te committen naar main.
permissions:
  contents: write
  pages: write
  id-token: write

# Default to bash
defaults:
  run:
    shell: bash

# Environment variables available to all jobs and steps in this workflow
env:
  HUGO_ENV: production
  HUGO_VERSION: "0.151.0"
  TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-arm64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      # Geeft bij de dagelijkse cron-run één SC-serie-draft vrij en commit dat
      # terug naar main. De build hieronder pakt de vrijgegeven post meteen mee,
      # dus publiceren en deployen gebeuren in dezelfde run.
      - name: Publiceer volgende SC-post (alleen bij schedule/handmatig)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/publish_next_linkedin_post.py | tee /tmp/pub.txt
          if grep -q '^PUBLISHED ' /tmp/pub.txt; then
            slug="$(sed -n 's/^PUBLISHED //p' /tmp/pub.txt)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "content: publiceer SC-serie post ${slug} [scheduled]"
            git push origin HEAD:main
          else
            echo "Niets te publiceren vandaag."
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup Project
        run: npm run project-setup

      - name: Install npm dependencies
        run: npm install

      - name: Build site
        run: npm run build

      # --- Audit reports (Eleventy) → /rapporten/ ---
      # continue-on-error: pa-audit gebruikt Git LFS; bij een LFS-fetchfout
      # (bv. overschreden bandbreedte/quota) mag de site toch deployen.
      # /rapporten/ kan dan tijdelijk verouderd zijn tot LFS weer werkt.
      - name: Checkout audit reports repo
        continue-on-error: true
        uses: actions/checkout@v5.0.0
        with:
          repository: JuliaTol-properaccess/pa-audit
          token: ${{ secrets.PA_AUDIT_TOKEN }}
          path: _audit-reports
          lfs: true

      - name: Install audit reports dependencies
        continue-on-error: true
        run: npm ci
        working-directory: _audit-reports

      - name: Build audit reports
        continue-on-error: true
        run: npm run build
        working-directory: _audit-reports

      - name: Copy audit reports to /rapporten/
        continue-on-error: true
        run: rsync -a _audit-reports/dist/ ./public/rapporten/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-arm
    needs: build
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      # Leegt de Cloudflare-cache zodat vervangen bestanden (zelfde naam, bv.
      # foto's, CSS) meteen vers worden geserveerd. Wordt overgeslagen zolang
      # het secret CLOUDFLARE_API_TOKEN nog niet is ingesteld.
      - name: Purge Cloudflare cache
        if: env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Ping Google to recrawl sitemap
        run: curl -s "https://www.google.com/ping?sitemap=https://www.properaccess.nl/sitemap.xml"

      # IndexNow nudge voor Bing/Copilot (ChatGPT-search leunt op de Bing-index).
      # De key is publiek (gepubliceerd op /<key>.txt), dus geen secret.
      # Basislijst met kernpagina's; uit te breiden met change-detectie indien gewenst.
      - name: Ping IndexNow (Bing/Copilot)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" -d '{"host":"www.properaccess.nl","key":"4da3b6cd119f757a090fc80e4ce46fd2","keyLocation":"https://www.properaccess.nl/4da3b6cd119f757a090fc80e4ce46fd2.txt","urlList":["https://www.properaccess.nl/","https://www.properaccess.nl/toegankelijkheidsaudit/"]}'
