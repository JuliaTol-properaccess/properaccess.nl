<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Vast beeld rubriek Nieuws over toegankelijkheid</title>
<style>
/* Opmaak van het vaste beeld voor de rubriek Nieuws over toegankelijkheid.
   1856 bij 2304 pixels, staand 4:5. Alle maten in pixels, want dit vel wordt
   op precies die maat afgedrukt; er is geen responsief gedrag.

   De lettertypes zijn dezelfde woff2-bestanden als op de site (static/fonts/),
   de kleuren dezelfde als in assets/css/custom.css:
   #1F2937 donkerblauw, #A30D4B magenta, #5b6270 gedempt grijs. */

@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 200 800;
  src: url('fonts/plus-jakarta-sans-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Nunito Sans';
  font-style: normal;
  font-weight: 200 1000;
  src: url('fonts/nunito-sans-latin.woff2') format('woff2');
}

:root {
  --donker: #1F2937;
  --magenta: #A30D4B;
  --gedempt: #5b6270;

  --marge-links: 170px;

  --kop-grootte: 166px;
  --kop-regel: 168.5px;
  --kop-top: 217px;

  --streep-top: 1133px;
  --streep-breedte: 412px;
  --streep-hoogte: 40px;

  --foto-maat: 722px;
  --foto-wit: 17px;
  --foto-ring: 15px;
  --cirkel-links: 145px;
  --cirkel-top: 1385px;

  --naam-links: 1018px;
  --naam-grootte: 106px;
  --naam-top: 1609px;
  --rol-grootte: 90px;
  --rol-regel: 105px;
  --rol-top: 1729px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1856px;
  height: 2304px;
}

body {
  background: #ffffff;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.kop {
  position: absolute;
  left: var(--marge-links);
  top: var(--kop-top);
  width: 1540px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: var(--kop-grootte);
  line-height: var(--kop-regel);
  letter-spacing: -0.015em;
  color: var(--donker);
}

/* "deze week?" is het accent van de vraag en staat daarom in magenta.
   Een eigen regel, zodat het altijd onder de kop uitkomt. */
.kop__accent {
  color: var(--magenta);
  display: block;
}

.streep {
  position: absolute;
  left: var(--marge-links);
  top: var(--streep-top);
  width: var(--streep-breedte);
  height: var(--streep-hoogte);
  background: var(--magenta);
}

/* De ring is een border om een wit vlak; de witte rand tussen ring en foto
   komt uit de padding. Zo blijft het één element en loopt er niets scheef. */
.cirkel {
  position: absolute;
  left: var(--cirkel-links);
  top: var(--cirkel-top);
  width: calc(var(--foto-maat) + 2 * var(--foto-wit) + 2 * var(--foto-ring));
  height: calc(var(--foto-maat) + 2 * var(--foto-wit) + 2 * var(--foto-ring));
  padding: var(--foto-wit);
  border: var(--foto-ring) solid var(--magenta);
  border-radius: 50%;
  background: #ffffff;
}

/* De uitsnede. Het gezicht staat in julia.webp (800 bij 800) links van het
   midden en hoog, dus een rondje om het midden van de foto zet het hoofd
   scheef en klein. Daarom wordt de foto op 1076 pixels gezet en verschoven:
   de kruin (y=102 in de bron) komt 10 pixels onder de bovenkant van het
   rondje. Horizontaal ligt het gezicht tussen twee uitersten in: precies op
   het midden van het haar zou het gezicht naar rechts duwen, precies op het
   midden van het gezicht zou links haar wegvallen. -70 houdt het haar heel
   en zet het gezicht vlak bij het midden. Zo vult het hoofd het rondje net
   zo ver als in het beeld van PR 312, en staat de witte kraag onderin. */
.cirkel__masker {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
}

.cirkel__foto {
  display: block;
  position: absolute;
  width: 1076px;
  height: 1076px;
  left: -70px;
  top: -127px;
}

/* Naam en functie staan los van elkaar op een vaste plek, zodat de afstand
   tussen die twee regels niet meeverandert met de regelhoogte van de naam.
   De breedte van .rol dwingt de afbreking "expert digitale" /
   "toegankelijkheid", net als in het beeld van PR 312. */
.naam {
  position: absolute;
  left: var(--naam-links);
  top: var(--naam-top);
  width: 690px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: var(--naam-grootte);
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--donker);
}

.rol {
  position: absolute;
  left: var(--naam-links);
  top: var(--rol-top);
  width: 690px;
  font-family: 'Nunito Sans', sans-serif;
  font-weight: 400;
  font-size: var(--rol-grootte);
  line-height: var(--rol-regel);
  letter-spacing: 0;
  color: var(--gedempt);
}
</style>
</head>
<body>

<p class="kop">Wat verscheen in de media over digitale toegankelijkheid
  <span class="kop__accent">deze week?</span>
</p>

<div class="streep"></div>

<div class="cirkel">
  <div class="cirkel__masker">
    <img class="cirkel__foto" src="julia.png" alt="">
  </div>
</div>

<div class="naam">Julia&nbsp;Tol</div>
<div class="rol">expert digitale toegankelijkheid</div>

</body>
</html>
