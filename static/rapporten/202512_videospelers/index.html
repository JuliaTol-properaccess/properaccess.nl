<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Rapport op aanvraag bij de opdrachtgever - Proper Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #F5F5F5;
      font-family: 'Nunito', sans-serif;
      color: #1F2937;
      line-height: 1.6;
    }
    header {
      background: #1F2937;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    header .brand {
      font-family: 'Nunito Sans', sans-serif;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 800;
      text-decoration: none;
    }
    header .brand span { color: #A30D4B; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 560px;
      background: #fff;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 0 1rem;
      color: #1F2937;
    }
    p { font-size: 1.05rem; margin: 0 0 1rem; }
    .contact {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }
    a { color: #A30D4B; font-weight: 700; }
    a:focus-visible { outline: 3px solid #004050; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <a href="https://www.properaccess.nl/" class="brand">Proper<span>Access</span></a>
  </header>
  <main>
    <div class="card">
      <h1>Dit rapport is op te vragen bij de opdrachtgever</h1>
      <p>Het toegankelijkheidsrapport dat hier stond, is niet meer openbaar te bekijken.</p>
      <p>Wil je het rapport inzien? Vraag het op bij de opdrachtgever, Blue Billywig.</p>
      <div class="contact">
        <p>Neem contact op met Blue Billywig via telefoonnummer <a href="tel:+31358200280">035 820 0280</a>.</p>
      </div>
    </div>
  </main>
</body>
</html>
