<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Impact bij digitale toegankelijkheid</title>
  <desc id="desc">Een LinkedIn-visual van Proper Access over impact bij digitale toegankelijkheid, met een voorbeeld uit een toegankelijkheidsrapport en een ronde foto van Julia Tol.</desc>
  <defs>
    <clipPath id="portrait"><circle cx="1350" cy="707" r="92"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2937" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f7f8f9"/>
  <path d="M0 0H1600V72H0Z" fill="#1f2937"/>
  <path d="M0 828H1600V900H0Z" fill="#1f2937"/>
  <circle cx="1490" cy="160" r="170" fill="#087f80" opacity=".12"/>
  <circle cx="115" cy="770" r="230" fill="#a50050" opacity=".08"/>

  <text x="110" y="148" font-family="Nunito, Arial, sans-serif" font-size="35" font-weight="700" fill="#087f80">Proper Access</text>
  <text x="110" y="270" font-family="Nunito, Arial, sans-serif" font-size="72" font-weight="900" fill="#1f2937">Impact bij digitale</text>
  <text x="110" y="360" font-family="Nunito, Arial, sans-serif" font-size="86" font-weight="900" fill="#a50050">toegankelijkheid</text>
  <text x="116" y="438" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#087f80">Zo zie je die terug in een rapport</text>

  <g transform="translate(110 548)" filter="url(#shadow)">
    <rect width="600" height="128" rx="22" fill="#fff" stroke="#d9dee5" stroke-width="3"/>
    <circle cx="56" cy="64" r="25" fill="#a50050"/>
    <path d="M48 64h16M56 56v16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="105" y="57" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="800" fill="#1f2937">Kan iemand hierdoor</text>
    <text x="105" y="91" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="800" fill="#1f2937">niet verder?</text>
  </g>
  <g transform="translate(760 224)" filter="url(#shadow)">
    <rect width="730" height="216" rx="24" fill="#fff" stroke="#a50050" stroke-width="7"/>
    <image x="20" y="20" width="690" height="176" preserveAspectRatio="xMidYMid slice" href="/images/social/2026-10-29_impact-screenshot.png"/>
  </g>
  <text x="1125" y="485" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="25" font-weight="800" fill="#1f2937">Impact is een inschatting van het gevolg</text>

  <circle cx="1350" cy="707" r="103" fill="#fff" stroke="#a50050" stroke-width="8"/>
  <image x="1258" y="615" width="184" height="184" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)" href="/images/julia.webp"/>
  <text x="1350" y="845" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2937">Julia Tol</text>
  <text x="1450" y="858" text-anchor="end" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">properaccess.nl</text>
</svg>
