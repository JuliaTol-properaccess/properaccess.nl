<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="392" height="392" rx="12" fill="#1F2937" opacity="0.10"/>
  <rect x="0" y="0" width="392" height="392" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-opacity="0.15" stroke-width="1"/>

  <text x="24" y="36" fill="#1F2937" font-family="Plus Jakarta Sans, Nunito Sans, sans-serif" font-size="14" font-weight="700">Weergeven of handelen</text>
  <text x="24" y="52" fill="#1F2937" fill-opacity="0.72" font-family="Nunito, sans-serif" font-size="9">Waarom een schermlezer een tool niet zelf aanroept</text>
  <line x1="24" y1="64" x2="368" y2="64" stroke="#1F2937" stroke-opacity="0.1" stroke-width="1"/>

  <rect x="24" y="80" width="344" height="112" rx="8" stroke="#004050" stroke-width="1.5"/>
  <rect x="24" y="80" width="344" height="5" rx="2.5" fill="#004050"/>
  <text x="36" y="104" fill="#004050" font-family="Plus Jakarta Sans, Nunito Sans, sans-serif" font-size="10" font-weight="700">Schermlezer</text>
  <text x="36" y="118" fill="#1F2937" fill-opacity="0.72" font-family="Nunito, sans-serif" font-size="8">Reageert op waar de gebruiker is</text>

  <circle cx="44" cy="140" r="9" stroke="#004050" stroke-width="1"/>
  <text x="41" y="143" fill="#004050" font-family="Nunito, sans-serif" font-size="8" font-weight="700">1</text>
  <text x="60" y="143" fill="#1F2937" font-family="Nunito, sans-serif" font-size="8.5">De gebruiker navigeert naar een element</text>

  <circle cx="44" cy="168" r="9" stroke="#004050" stroke-width="1"/>
  <text x="41" y="171" fill="#004050" font-family="Nunito, sans-serif" font-size="8" font-weight="700">2</text>
  <text x="60" y="171" fill="#1F2937" font-family="Nunito, sans-serif" font-size="8.5">Naam, rol en status worden voorgelezen</text>

  <rect x="24" y="208" width="344" height="140" rx="8" stroke="#1F2937" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="24" y="208" width="344" height="5" rx="2.5" fill="#1F2937" fill-opacity="0.35"/>
  <text x="36" y="232" fill="#1F2937" font-family="Plus Jakarta Sans, Nunito Sans, sans-serif" font-size="10" font-weight="700">Een tool aanroepen</text>
  <text x="36" y="246" fill="#1F2937" fill-opacity="0.72" font-family="Nunito, sans-serif" font-size="8">Drie stappen die een schermlezer niet doet</text>

  <circle cx="44" cy="268" r="9" stroke="#A30D4B" stroke-width="1"/>
  <text x="41" y="271" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="8" font-weight="700">1</text>
  <text x="60" y="271" fill="#1F2937" font-family="Nunito, sans-serif" font-size="8.5">Kiezen welke handeling past</text>

  <circle cx="44" cy="296" r="9" stroke="#A30D4B" stroke-width="1"/>
  <text x="41" y="299" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="8" font-weight="700">2</text>
  <text x="60" y="299" fill="#1F2937" font-family="Nunito, sans-serif" font-size="8.5">De invoer opbouwen die het schema vraagt</text>

  <circle cx="44" cy="324" r="9" stroke="#A30D4B" stroke-width="1"/>
  <text x="41" y="327" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="8" font-weight="700">3</text>
  <text x="60" y="327" fill="#1F2937" font-family="Nunito, sans-serif" font-size="8.5">Het resultaat interpreteren</text>

  <text x="24" y="372" fill="#004050" font-family="Nunito, sans-serif" font-size="8.5" font-weight="600">Daarvoor is een agent nodig, naast de schermlezer.</text>
</svg>
