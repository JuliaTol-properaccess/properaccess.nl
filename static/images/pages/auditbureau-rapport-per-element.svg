  <!-- bevindingenlijst -->
  <g font-family="sans-serif" font-size="7.5" fill="#1F2937">
    <circle cx="371" cy="103" r="2.5" fill="#A30D4B"/>
    <text x="379" y="106">Focus niet zichtbaar</text>
    <circle cx="371" cy="119" r="2.5" fill="#A30D4B"/>
    <text x="379" y="122">Geen toetsenbordbediening</text>
    <circle cx="371" cy="135" r="2.5" fill="#A30D4B"/>
    <text x="379" y="138">Rol ontbreekt in de code</text>
    <circle cx="371" cy="151" r="2.5" fill="#A30D4B"/>
    <text x="379" y="154">Contrast te laag</text>
  </g>

  <!-- user story -->
  <rect x="282" y="168" width="168" height="36" rx="3" fill="#f5f5f5"/>
  <text x="290" y="182" font-family="sans-serif" font-size="7" font-weight="700" fill="#004050">USER STORY</text>
  <text x="290" y="195" font-family="sans-serif" font-size="7.5" fill="#1F2937">Als toetsenbordgebruiker wil ik een</text>
  <text x="290" y="204" font-family="sans-serif" font-size="7.5" fill="#1F2937">datum kunnen kiezen zonder muis.</text>

  <text x="266" y="256" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1F2937">Eén kaart, één component, één fix</text>
  <text x="266" y="269" font-family="sans-serif" font-size="8" fill="#6B7280">met screenshot en code-voorbeeld erbij</text>
</svg>
