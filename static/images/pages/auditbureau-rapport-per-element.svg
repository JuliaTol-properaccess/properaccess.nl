  <!-- legenda links -->
  <circle cx="21" cy="234" r="3.5" fill="#A30D4B"/>
  <text x="30" y="237" font-family="sans-serif" font-size="8" fill="#6B7280">= dezelfde datepicker</text>
  <text x="16" y="256" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1F2937">Twaalf plekken bij elkaar zoeken</text>
  <text x="16" y="269" font-family="sans-serif" font-size="8" fill="#6B7280">voordat er iets opgelost kan worden</text>

  <!-- ============ SCHEIDING ============ -->
  <line x1="248" y1="14" x2="248" y2="276" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ RECHTS: per element ============ -->
  <text x="266" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#1F2937">Gesorteerd per element</text>
  <text x="266" y="34" font-family="sans-serif" font-size="8.5" fill="#6B7280">Alles over de datepicker op één plek</text>

  <!-- grote kaart -->
  <rect x="266" y="46" width="198" height="170" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="266" y="46" width="4" height="170" rx="2" fill="#A30D4B"/>

  <!-- kaart-header -->
  <text x="282" y="65" font-family="sans-serif" font-size="10" font-weight="700" fill="#1F2937">Datepicker</text>
  <text x="282" y="78" font-family="sans-serif" font-size="7.5" fill="#6B7280">Boekingsformulier, stap 2</text>
  <line x1="282" y1="86" x2="450" y2="86" stroke="#e5e7eb" stroke-width="1"/>

  <!-- mini wireframe van de datepicker -->
  <rect x="282" y="96" width="74" height="60" rx="3" fill="#f5f5f5" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="288" y="102" width="62" height="10" rx="2" fill="#1F2937"/>
  <g fill="#d1d5db">
    <rect x="288" y="118" width="8" height="8" rx="1.5"/>
    <rect x="300" y="118" width="8" height="8" rx="1.5"/>
    <rect x="312" y="118" width="8" height="8" rx="1.5"/>
    <rect x="324" y="118" width="8" height="8" rx="1.5"/>
    <rect x="336" y="118" width="8" height="8" rx="1.5"/>
    <rect x="288" y="130" width="8" height="8" rx="1.5"/>
    <rect x="312" y="130" width="8" height="8" rx="1.5"/>
    <rect x="324" y="130" width="8" height="8" rx="1.5"/>
    <rect x="336" y="130" width="8" height="8" rx="1.5"/>
