<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="presentation">
  <rect width="480" height="300" fill="#ffffff"/>

  <!-- Bevinding in de Radar -->
  <rect x="12" y="14" width="456" height="96" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="12" y="14" width="4" height="96" rx="2" fill="#A30D4B"/>
  <text x="30" y="36" font-family="sans-serif" font-size="11" font-weight="700" fill="#1F2937">Knop zonder toegankelijke naam</text>
  <text x="30" y="52" font-family="sans-serif" font-size="8.5" fill="#4B5563">4.1.2 Naam, rol, waarde</text>
  <rect x="30" y="60" width="290" height="4" rx="2" fill="#d1d5db"/>
  <rect x="30" y="70" width="220" height="4" rx="2" fill="#d1d5db"/>

  <rect x="30" y="82" width="180" height="18" rx="9" fill="#ffffff" stroke="#A30D4B" stroke-width="1.5"/>
  <text x="120" y="94" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#A30D4B">Vraag dit aan een auditor</text>

  <!-- Pijl omlaag -->
  <path d="M240 112 L240 148" stroke="#A30D4B" stroke-width="2" fill="none"/>
  <path d="M234 142 L240 150 L246 142" stroke="#A30D4B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="252" y="134" font-family="sans-serif" font-size="8" fill="#4B5563">1 strip</text>

  <!-- Antwoord van de auditor -->
  <rect x="12" y="158" width="456" height="128" rx="8" fill="#f5f5f5"/>
  <rect x="12" y="158" width="4" height="128" rx="2" fill="#004050"/>
  <text x="30" y="180" font-family="sans-serif" font-size="11" font-weight="700" fill="#1F2937">Antwoord van een senior auditor</text>
  <text x="30" y="196" font-family="sans-serif" font-size="8.5" fill="#4B5563">Binnen 3 tot 5 werkdagen</text>

  <rect x="30" y="208" width="420" height="4" rx="2" fill="#d1d5db"/>
  <rect x="30" y="220" width="386" height="4" rx="2" fill="#d1d5db"/>
  <rect x="30" y="232" width="404" height="4" rx="2" fill="#d1d5db"/>
  <rect x="30" y="244" width="250" height="4" rx="2" fill="#d1d5db"/>

  <text x="30" y="272" font-family="sans-serif" font-size="8" font-weight="700" fill="#004050">Vervolgvragen in dezelfde draad kosten niets extra</text>
</svg>
