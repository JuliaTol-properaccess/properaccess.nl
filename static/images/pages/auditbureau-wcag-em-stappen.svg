<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="presentation">
  <rect width="480" height="150" fill="#ffffff"/>

  <!-- verbindingslijn -->
  <line x1="46" y1="46" x2="434" y2="46" stroke="#e5e7eb" stroke-width="2"/>

  <g font-family="sans-serif">
    <!-- stap 1 -->
    <circle cx="46" cy="46" r="20" fill="#A30D4B"/>
    <text x="46" y="51" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="46" y="88" font-size="9" font-weight="700" fill="#1F2937" text-anchor="middle">Reikwijdte</text>
    <text x="46" y="100" font-size="8" fill="#6B7280" text-anchor="middle">Wat hoort erbij</text>
    <text x="46" y="111" font-size="8" fill="#6B7280" text-anchor="middle">en wat niet</text>

    <!-- stap 2 -->
    <circle cx="143" cy="46" r="20" fill="#004050"/>
    <text x="143" y="51" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="143" y="88" font-size="9" font-weight="700" fill="#1F2937" text-anchor="middle">Verkennen</text>
    <text x="143" y="100" font-size="8" fill="#6B7280" text-anchor="middle">De site leren</text>
    <text x="143" y="111" font-size="8" fill="#6B7280" text-anchor="middle">kennen</text>

    <!-- stap 3 -->
    <circle cx="240" cy="46" r="20" fill="#A30D4B"/>
    <text x="240" y="51" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="240" y="88" font-size="9" font-weight="700" fill="#1F2937" text-anchor="middle">Steekproef</text>
    <text x="240" y="100" font-size="8" fill="#6B7280" text-anchor="middle">Representatieve</text>
    <text x="240" y="111" font-size="8" fill="#6B7280" text-anchor="middle">selectie pagina's</text>

    <!-- stap 4 -->
    <circle cx="337" cy="46" r="20" fill="#004050"/>
    <text x="337" y="51" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="337" y="88" font-size="9" font-weight="700" fill="#1F2937" text-anchor="middle">Toetsen</text>
    <text x="337" y="100" font-size="8" fill="#6B7280" text-anchor="middle">Handmatig, per</text>
    <text x="337" y="111" font-size="8" fill="#6B7280" text-anchor="middle">succescriterium</text>

    <!-- stap 5 -->
    <circle cx="434" cy="46" r="20" fill="#1F2937"/>
    <text x="434" y="51" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="434" y="88" font-size="9" font-weight="700" fill="#1F2937" text-anchor="middle">Rapporteren</text>
    <text x="434" y="100" font-size="8" fill="#6B7280" text-anchor="middle">Bevindingen met</text>
    <text x="434" y="111" font-size="8" fill="#6B7280" text-anchor="middle">bewijs erbij</text>
  </g>

  <line x1="14" y1="130" x2="466" y2="130" stroke="#e5e7eb" stroke-width="1"/>
  <text x="14" y="145" font-family="sans-serif" font-size="8" fill="#6B7280">Het Register accepteert geen onderzoek dat niet volgens deze vijf stappen is uitgevoerd.</text>
</svg>
