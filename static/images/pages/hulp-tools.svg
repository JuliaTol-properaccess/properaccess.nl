<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="presentation">
  <rect width="480" height="300" fill="#ffffff"/>

  <!-- WCAG Radar -->
  <rect x="12" y="12" width="456" height="112" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="12" y="12" width="4" height="112" rx="2" fill="#A30D4B"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2937">WCAG Radar</text>
  <text x="30" y="49" font-family="sans-serif" font-size="8.5" fill="#4B5563">Toont bevindingen op de pagina die je bekijkt</text>

  <rect x="30" y="60" width="200" height="22" rx="4" fill="#f5f5f5"/>
  <circle cx="42" cy="71" r="4" fill="#A30D4B"/>
  <text x="53" y="74" font-family="sans-serif" font-size="8" fill="#1F2937">Knop zonder toegankelijke naam</text>

  <rect x="30" y="86" width="200" height="22" rx="4" fill="#f5f5f5"/>
  <circle cx="42" cy="97" r="4" fill="#A30D4B"/>
  <text x="53" y="100" font-family="sans-serif" font-size="8" fill="#1F2937">Kop overgeslagen: h2 naar h4</text>

  <rect x="244" y="60" width="200" height="22" rx="4" fill="#f5f5f5"/>
  <rect x="255" y="67" width="8" height="8" rx="1.5" fill="#004050"/>
  <text x="269" y="74" font-family="sans-serif" font-size="8" fill="#1F2937">Contrast voldoet</text>

  <rect x="244" y="86" width="200" height="22" rx="4" fill="#f5f5f5"/>
  <rect x="255" y="93" width="8" height="8" rx="1.5" fill="#004050"/>
  <text x="269" y="100" font-family="sans-serif" font-size="8" fill="#1F2937">Alle velden hebben een label</text>

  <!-- axe -->
  <rect x="12" y="136" width="222" height="152" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="12" y="136" width="4" height="152" rx="2" fill="#1F2937"/>
  <text x="30" y="158" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2937">axe</text>
  <text x="30" y="173" font-family="sans-serif" font-size="8.5" fill="#4B5563">Scant de code van een pagina</text>

  <rect x="30" y="186" width="186" height="14" rx="3" fill="#f5f5f5"/>
  <rect x="36" y="191" width="90" height="4" rx="2" fill="#d1d5db"/>
  <rect x="30" y="204" width="186" height="14" rx="3" fill="#f5f5f5"/>
  <rect x="36" y="209" width="120" height="4" rx="2" fill="#d1d5db"/>
  <rect x="30" y="222" width="186" height="14" rx="3" fill="#f5f5f5"/>
  <rect x="36" y="227" width="70" height="4" rx="2" fill="#d1d5db"/>

  <text x="30" y="256" font-family="sans-serif" font-size="8" font-weight="700" fill="#A30D4B">Vindt circa 30% van de criteria</text>
  <text x="30" y="270" font-family="sans-serif" font-size="8" fill="#4B5563">De rest blijft handwerk</text>

  <!-- Colour Contrast Analyzer -->
  <rect x="246" y="136" width="222" height="152" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="246" y="136" width="4" height="152" rx="2" fill="#004050"/>
  <text x="264" y="158" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2937">Colour Contrast Analyzer</text>
  <text x="264" y="173" font-family="sans-serif" font-size="8.5" fill="#4B5563">Meet twee kleuren tegen elkaar</text>

  <rect x="264" y="186" width="88" height="44" rx="6" fill="#1F2937"/>
  <text x="308" y="213" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Tekst</text>

  <rect x="362" y="186" width="88" height="44" rx="6" fill="#f5f5f5" stroke="#e5e7eb" stroke-width="1"/>
  <text x="406" y="213" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1F2937">Achtergrond</text>

  <text x="264" y="256" font-family="sans-serif" font-size="8" font-weight="700" fill="#A30D4B">13,5 : 1</text>
  <text x="264" y="270" font-family="sans-serif" font-size="8" fill="#4B5563">AA vraagt 4,5 : 1 voor gewone tekst</text>
</svg>
