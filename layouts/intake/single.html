{{ define "main" }}

<section class="section intake">
  <div class="container">
    <div class="intake__wrapper">
      <header class="intake__head">
        <span class="intake__label">Onderzoek inplannen</span>
        <h1 class="intake__title">{{ .Title }}</h1>
      </header>
      <div class="intake__intro">{{ .Content }}</div>
      <p>
        <a class="btn btn-primary" href="https://portaal.properaccess.nl/login?volgende=/intake">Naar de intake in het portaal</a>
      </p>
    </div>
  </div>
</section>

<style>
  .intake__wrapper { max-width: 46rem; margin: 0 auto; }
  .intake__label {
    display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: #A30D4B; margin-bottom: 0.5rem;
  }
  .intake__title { color: #1F2937; margin: 0 0 0.75rem; }
  .intake__intro { color: #4B5563; font-size: 1.0625rem; margin-bottom: 2rem; }
</style>

{{ end }}
