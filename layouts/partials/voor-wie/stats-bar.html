<section class="hp-legal-cta" style="padding: 3rem 0;">
  <div class="hp-container">
    <div class="hp-legal-cta__card" style="padding: 3rem;">
      <div class="hp-legal-cta__gradient" aria-hidden="true"></div>
      <div class="vw-stats-grid">
        <div class="vw-stat">
          <span class="vw-stat__number">950+</span>
          <span class="vw-stat__label"{{ if eq site.Language.Lang "en" }} lang="nl"{{ end }}>websites geaudit</span>
        </div>
        <div class="vw-stat">
          <span class="vw-stat__number">50+</span>
          <span class="vw-stat__label"{{ if eq site.Language.Lang "en" }} lang="nl"{{ end }}>apps geaudit</span>
        </div>
        <div class="vw-stat">
          <span class="vw-stat__number">63</span>
          <span class="vw-stat__label"{{ if eq site.Language.Lang "en" }} lang="nl"{{ end }}>opdrachtgevers</span>
        </div>
        <div class="vw-stat">
          <span class="vw-stat__number">40%</span>
          <span class="vw-stat__label"{{ if eq site.Language.Lang "en" }} lang="nl"{{ end }}>herhalingsklanten</span>
        </div>
      </div>
      <p class="stats-peildatum stats-peildatum--center"{{ if eq site.Language.Lang "en" }} lang="nl"{{ end }}>Peildatum 7 augustus 2026.</p>
    </div>
  </div>
</section>
