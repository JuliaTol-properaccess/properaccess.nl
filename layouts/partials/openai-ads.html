{{- with site.Params.openai_ads.pixel_id -}}
<script>
  (function (w, d, s, u) {
    if (w.oaiq) return;
    var q = function () { q.q.push(arguments); };
    q.q = [];
    w.oaiq = q;
    var js = d.createElement(s);
    js.async = true;
    js.src = u;
    var f = d.getElementsByTagName(s)[0];
    f.parentNode.insertBefore(js, f);
  })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");

  var consentGiven = /(?:^|;)\s*cookie-consent=accepted(?:;|$)/.test(document.cookie);
  oaiq("consent", consentGiven);
  oaiq("init", {
    pixelId: "{{ . }}"{{ with site.Params.openai_ads.debug }},
    debug: true{{ end }}
  });

  window.paOpenAiGrantConsent = function () {
    if (window.oaiq) window.oaiq("consent", true);
  };

  window.paOpenAiRevokeConsent = function () {
    if (window.oaiq) window.oaiq("consent", false);
  };

  window.paOpenAiMeasure = function (eventName, eventId) {
    if (!window.oaiq) return;
    window.oaiq("measure", eventName, { type: "customer_action" }, {
      event_id: eventId
    });
  };
</script>
{{- end -}}
