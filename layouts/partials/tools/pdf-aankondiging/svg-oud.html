{{/* Waarom de oude tool weg is: de controlelijst stond als leesbare code op de site. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 440 320" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfann-svg">
  <rect x="0.5" y="0.5" width="439" height="319" rx="14" fill="#fff" stroke="#e5e7eb"/>

  <text x="28" y="38" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9" font-weight="800" letter-spacing="0.06em">{{ cond $nl "DE OUDE TOOL, IN DE BROWSER" "THE OLD TOOL, IN THE BROWSER" }}</text>

  <!-- Browservenster met zichtbare broncode -->
  <rect x="28" y="50" width="384" height="150" rx="10" fill="#1F2937"/>
  <path d="M28 74 h384" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="44" cy="62" r="3.5" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="56" cy="62" r="3.5" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="68" cy="62" r="3.5" fill="#ffffff" fill-opacity="0.15"/>
  <text x="88" y="66" fill="#9ca3af" font-family="monospace" font-size="8.5">tool-pdf-checker.js</text>

  <text x="46" y="94" fill="#6B7280" font-family="monospace" font-size="8.5">1</text>
  <text x="70" y="94" fill="#9ca3af" font-family="monospace" font-size="8.5">const <tspan fill="#8fd6c0">stopwoorden</tspan> = { nl: [<tspan fill="#f0a8c4">"de"</tspan>, <tspan fill="#f0a8c4">"het"</tspan>, <tspan fill="#f0a8c4">"een"</tspan>, …] }</text>
  <text x="46" y="112" fill="#6B7280" font-family="monospace" font-size="8.5">2</text>
  <text x="70" y="112" fill="#9ca3af" font-family="monospace" font-size="8.5">const <tspan fill="#8fd6c0">nietszeggendeTitel</tspan> = /^(document|untitled)/i</text>
  <text x="46" y="130" fill="#6B7280" font-family="monospace" font-size="8.5">3</text>
  <text x="70" y="130" fill="#9ca3af" font-family="monospace" font-size="8.5">const <tspan fill="#8fd6c0">meldingen</tspan> = { tagsOntbreken: <tspan fill="#f0a8c4">"PDF mist tags"</tspan>, …</text>
  <text x="46" y="148" fill="#6B7280" font-family="monospace" font-size="8.5">4</text>
  <text x="70" y="148" fill="#9ca3af" font-family="monospace" font-size="8.5">function <tspan fill="#8fd6c0">controleerKoppen</tspan>(tags) { … }</text>
  <text x="46" y="166" fill="#6B7280" font-family="monospace" font-size="8.5">5</text>
  <text x="70" y="166" fill="#9ca3af" font-family="monospace" font-size="8.5">function <tspan fill="#8fd6c0">controleerTabellen</tspan>(tags) { … }</text>
  <rect x="70" y="178" width="150" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
  <text x="232" y="184" fill="#6B7280" font-family="monospace" font-size="8.5">{{ cond $nl "en zo nog 1.905 regels" "and 1,905 more lines" }}</text>

  <!-- Iedereen kon meelezen -->
  <path d="M220 208 v18" stroke="#A30D4B" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M214 220 l6 7 6 -7" stroke="#A30D4B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="28" y="234" width="182" height="58" rx="10" stroke="#A30D4B" stroke-width="1.3" fill="none"/>
  <circle cx="60" cy="263" r="14" fill="#fff" stroke="#A30D4B" stroke-width="1.6"/>
  <path d="M50 263 c 4 -6 16 -6 20 0 c -4 6 -16 6 -20 0 z" fill="none" stroke="#A30D4B" stroke-width="1.5"/>
  <circle cx="60" cy="263" r="3.4" fill="#A30D4B"/>
  <text x="84" y="260" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10.5" font-weight="700">{{ cond $nl "Iedereen kon" "Anyone could" }}</text>
  <text x="84" y="275" fill="#4b5563" font-family="Nunito, sans-serif" font-size="10">{{ cond $nl "onze controlelijst lezen." "read our whole checklist." }}</text>

  <!-- De nieuwe plek -->
  <rect x="230" y="234" width="182" height="58" rx="10" stroke="#004050" stroke-width="1.3" fill="none"/>
  <rect x="252" y="248" width="30" height="30" rx="5" fill="#f5f5f5" stroke="#004050" stroke-width="1.3"/>
  <rect x="258" y="255" width="18" height="6" rx="2" fill="#fff" stroke="#004050" stroke-opacity="0.5"/>
  <rect x="258" y="266" width="18" height="6" rx="2" fill="#fff" stroke="#004050" stroke-opacity="0.5"/>
  <text x="296" y="260" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10.5" font-weight="700">{{ cond $nl "Nu draait het" "Now it runs" }}</text>
  <text x="296" y="275" fill="#4b5563" font-family="Nunito, sans-serif" font-size="10">{{ cond $nl "op onze server." "on our server." }}</text>
</svg>
