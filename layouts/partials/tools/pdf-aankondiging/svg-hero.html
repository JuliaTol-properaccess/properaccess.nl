{{/* Hero: een PDF krijgt een tagstructuur, het uiterlijk blijft hetzelfde. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 440 320" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfann-svg">
  <!-- Document voor de reparatie -->
  <rect x="16" y="52" width="146" height="196" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.4"/>
  <rect x="38" y="78" width="76" height="11" rx="5.5" fill="#1F2937" opacity="0.65"/>
  <rect x="38" y="102" width="102" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="38" y="115" width="102" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="38" y="128" width="64" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="38" y="150" width="102" height="44" rx="6" fill="#f5f5f5" stroke="#e5e7eb"/>
  <circle cx="58" cy="167" r="6" fill="#1F2937" opacity="0.2"/>
  <path d="M40 190 l20 -18 15 13 12 -10 22 15" stroke="#1F2937" stroke-width="1.4" opacity="0.25" fill="none" stroke-linejoin="round"/>
  <rect x="38" y="206" width="102" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="38" y="219" width="78" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <text x="16" y="40" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.06em">{{ cond $nl "VOOR" "BEFORE" }}</text>

  <!-- Lege tagkolom: er is geen structuur -->
  <rect x="112" y="60" width="42" height="180" rx="6" stroke="#A30D4B" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
  <path d="M120 142 h26" stroke="#A30D4B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Reparatiepijl -->
  <path d="M180 150 h58" stroke="#A30D4B" stroke-width="2" stroke-linecap="round"/>
  <path d="M230 143 l9 7 -9 7" stroke="#A30D4B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="209" cy="118" r="17" fill="#A30D4B"/>
  <path d="M203 118 l4 4 8 -9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="176" y="188" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="10" font-weight="800">{{ cond $nl "reparatie" "repair" }}</text>

  <!-- Document na de reparatie: exact dezelfde pagina -->
  <rect x="248" y="52" width="138" height="196" rx="10" fill="#fff" stroke="#004050" stroke-width="1.6"/>
  <rect x="270" y="78" width="76" height="11" rx="5.5" fill="#1F2937" opacity="0.65"/>
  <rect x="270" y="102" width="96" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="270" y="115" width="96" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="270" y="128" width="64" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="270" y="150" width="96" height="44" rx="6" fill="#f5f5f5" stroke="#e5e7eb"/>
  <circle cx="290" cy="167" r="6" fill="#1F2937" opacity="0.2"/>
  <path d="M272 190 l20 -18 15 13 12 -10 20 14" stroke="#1F2937" stroke-width="1.4" opacity="0.25" fill="none" stroke-linejoin="round"/>
  <rect x="270" y="206" width="96" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <rect x="270" y="219" width="78" height="6" rx="3" fill="#1F2937" opacity="0.2"/>
  <text x="248" y="40" fill="#004050" font-family="Nunito, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.06em">{{ cond $nl "NA" "AFTER" }}</text>

  <!-- Tagkolom: nu gevuld -->
  <rect x="366" y="72" width="34" height="16" rx="4" fill="#004050"/>
  <text x="374" y="83.5" fill="#fff" font-family="monospace" font-size="8.5" font-weight="700">H1</text>
  <rect x="366" y="96" width="30" height="16" rx="4" fill="#fff" stroke="#004050" stroke-width="1.1"/>
  <text x="374" y="107.5" fill="#004050" font-family="monospace" font-size="8.5" font-weight="700">P</text>
  <rect x="366" y="120" width="30" height="16" rx="4" fill="#fff" stroke="#004050" stroke-width="1.1"/>
  <text x="374" y="131.5" fill="#004050" font-family="monospace" font-size="8.5" font-weight="700">P</text>
  <rect x="366" y="152" width="54" height="16" rx="4" fill="#fff" stroke="#004050" stroke-width="1.1"/>
  <text x="373" y="163.5" fill="#004050" font-family="monospace" font-size="8.5" font-weight="700">Figure</text>
  <rect x="366" y="200" width="30" height="16" rx="4" fill="#fff" stroke="#004050" stroke-width="1.1"/>
  <text x="374" y="211.5" fill="#004050" font-family="monospace" font-size="8.5" font-weight="700">P</text>

  <!-- Onderregel -->
  <rect x="16" y="272" width="408" height="34" rx="17" stroke="#004050" stroke-width="1.3" fill="none"/>
  <path d="M42 289 l5 5 10 -11" stroke="#004050" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="70" y="293" fill="#004050" font-family="Nunito, sans-serif" font-size="11.5" font-weight="700">{{ cond $nl "Dezelfde pagina's, dezelfde opmaak" "Same pages, same layout" }}</text>
</svg>
