{{/* Wat we hebben gemeten, 19 augustus 2026. Staat op een donkere ondergrond. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 440 320" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfann-svg">
  <rect x="0.5" y="0.5" width="439" height="319" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16"/>

  <!-- 33 documenten -->
  <text x="28" y="42" fill="#9ca3af" font-family="Nunito, sans-serif" font-size="9" font-weight="800" letter-spacing="0.06em">{{ cond $nl "33 PDF'S VAN NEDERLANDSE ORGANISATIES" "33 PDFS FROM DUTCH ORGANISATIONS" }}</text>
  {{ range $r := seq 0 2 }}
    {{ range $c := seq 0 10 }}
      {{ $n := add (mul $r 11) $c }}
      {{ if lt $n 33 }}
  <rect x="{{ add 28 (mul $c 36) }}" y="{{ add 54 (mul $r 24) }}" width="24" height="18" rx="3" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>
      {{ end }}
    {{ end }}
  {{ end }}

  <!-- Bevindingen voor en na -->
  <text x="28" y="152" fill="#9ca3af" font-family="Nunito, sans-serif" font-size="9" font-weight="800" letter-spacing="0.06em">{{ cond $nl "BEVINDINGEN" "FINDINGS" }}</text>

  <text x="28" y="182" fill="#ffffff" font-family="Nunito, sans-serif" font-size="10" font-weight="700">{{ cond $nl "voor" "before" }}</text>
  <rect x="76" y="168" width="280" height="20" rx="10" fill="#e8a0ba"/>
  <text x="366" y="183" fill="#ffffff" font-family="Plus Jakarta Sans, Nunito Sans, sans-serif" font-size="16" font-weight="800">78</text>

  <text x="28" y="216" fill="#ffffff" font-family="Nunito, sans-serif" font-size="10" font-weight="700">{{ cond $nl "na" "after" }}</text>
  <rect x="76" y="202" width="108" height="20" rx="10" fill="#4ade80"/>
  <text x="196" y="217" fill="#ffffff" font-family="Plus Jakarta Sans, Nunito Sans, sans-serif" font-size="16" font-weight="800">30</text>

  <!-- Pixel-identiek -->
  <rect x="28" y="244" width="384" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="48" y="280" fill="#ffffff" font-family="Plus Jakarta Sans, Nunito Sans, sans-serif" font-size="26" font-weight="800">32</text>
  <text x="88" y="280" fill="#9ca3af" font-family="Nunito, sans-serif" font-size="13" font-weight="700">/ 33</text>
  <text x="140" y="266" fill="#ffffff" font-family="Nunito, sans-serif" font-size="10.5" font-weight="700">{{ cond $nl "documenten kwamen er pixel-identiek uit," "documents came out pixel-identical to the" }}</text>
  <text x="140" y="282" fill="#9ca3af" font-family="Nunito, sans-serif" font-size="10.5">{{ cond $nl "precies zoals ze erin gingen." "original they went in as." }}</text>
</svg>
