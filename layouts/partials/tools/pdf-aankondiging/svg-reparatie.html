{{/* Wat de nieuwe tool doet: upload, reparatie, pixelvergelijking en verslag. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 440 320" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfann-svg">
  <rect x="0.5" y="0.5" width="439" height="319" rx="14" fill="#fff" stroke="#e5e7eb"/>

  <!-- Stap 1: upload -->
  <text x="28" y="38" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9" font-weight="800" letter-spacing="0.06em">{{ cond $nl "JE UPLOADT" "YOU UPLOAD" }}</text>
  <rect x="28" y="50" width="86" height="112" rx="8" fill="#f5f5f5" stroke="#e5e7eb"/>
  <rect x="44" y="68" width="46" height="8" rx="4" fill="#1F2937" opacity="0.5"/>
  <rect x="44" y="86" width="54" height="5" rx="2.5" fill="#1F2937" opacity="0.2"/>
  <rect x="44" y="97" width="54" height="5" rx="2.5" fill="#1F2937" opacity="0.2"/>
  <rect x="44" y="112" width="54" height="30" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <path d="M56 84 v-14 m-5 5 l5 -5 5 5" stroke="#A30D4B" stroke-width="0" fill="none"/>

  <!-- Stap 2: reparatie -->
  <path d="M126 106 h26" stroke="#A30D4B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M146 100 l7 6 -7 6" stroke="#A30D4B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="166" y="38" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="9" font-weight="800" letter-spacing="0.06em">{{ cond $nl "WIJ REPAREREN" "WE REPAIR" }}</text>
  <rect x="166" y="50" width="108" height="112" rx="8" fill="#fff" stroke="#A30D4B" stroke-width="1.3"/>
  <rect x="180" y="66" width="36" height="16" rx="4" fill="#004050"/>
  <text x="188" y="77.5" fill="#fff" font-family="monospace" font-size="8.5" font-weight="700">tags</text>
  <rect x="222" y="66" width="38" height="16" rx="4" fill="#004050"/>
  <text x="229" y="77.5" fill="#fff" font-family="monospace" font-size="8.5" font-weight="700">{{ cond $nl "titel" "title" }}</text>
  <rect x="180" y="90" width="34" height="16" rx="4" fill="#004050"/>
  <text x="188" y="101.5" fill="#fff" font-family="monospace" font-size="8.5" font-weight="700">{{ cond $nl "taal" "lang" }}</text>
  <rect x="220" y="90" width="40" height="16" rx="4" fill="#fff" stroke="#004050" stroke-width="1.1"/>
  <text x="226" y="101.5" fill="#004050" font-family="monospace" font-size="8.5" font-weight="700">meta</text>
  <path d="M180 122 h80" stroke="#e5e7eb"/>
  <circle cx="190" cy="140" r="9" fill="#004050"/>
  <path d="M186 140 l3 3 5 -6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="206" y="144" fill="#1F2937" font-family="Nunito, sans-serif" font-size="9.5" font-weight="700">{{ cond $nl "op onze server" "on our server" }}</text>

  <!-- Stap 3: je eigen document terug -->
  <path d="M286 106 h26" stroke="#A30D4B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M306 100 l7 6 -7 6" stroke="#A30D4B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="326" y="38" fill="#004050" font-family="Nunito, sans-serif" font-size="9" font-weight="800" letter-spacing="0.06em">{{ cond $nl "JE KRIJGT TERUG" "YOU GET BACK" }}</text>
  <rect x="326" y="50" width="86" height="112" rx="8" fill="#fff" stroke="#004050" stroke-width="1.4"/>
  <rect x="342" y="68" width="46" height="8" rx="4" fill="#1F2937" opacity="0.5"/>
  <rect x="342" y="86" width="54" height="5" rx="2.5" fill="#1F2937" opacity="0.2"/>
  <rect x="342" y="97" width="54" height="5" rx="2.5" fill="#1F2937" opacity="0.2"/>
  <rect x="342" y="112" width="54" height="30" rx="4" fill="#fff" stroke="#e5e7eb"/>

  <!-- Pixelvergelijking -->
  <rect x="28" y="186" width="182" height="104" rx="8" fill="#f5f5f5" stroke="#e5e7eb"/>
  <text x="44" y="208" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10" font-weight="800">{{ cond $nl "Pagina voor en na, als beeld" "Pages before and after, as images" }}</text>
  <rect x="44" y="220" width="52" height="54" rx="4" fill="#fff" stroke="#e5e7eb"/>
  <rect x="54" y="232" width="26" height="5" rx="2.5" fill="#1F2937" opacity="0.3"/>
  <rect x="54" y="243" width="32" height="4" rx="2" fill="#1F2937" opacity="0.16"/>
  <rect x="54" y="252" width="32" height="4" rx="2" fill="#1F2937" opacity="0.16"/>
  <text x="106" y="250" fill="#004050" font-family="Nunito, sans-serif" font-size="15" font-weight="800">=</text>
  <rect x="130" y="220" width="52" height="54" rx="4" fill="#fff" stroke="#004050" stroke-width="1.2"/>
  <rect x="140" y="232" width="26" height="5" rx="2.5" fill="#1F2937" opacity="0.3"/>
  <rect x="140" y="243" width="32" height="4" rx="2" fill="#1F2937" opacity="0.16"/>
  <rect x="140" y="252" width="32" height="4" rx="2" fill="#1F2937" opacity="0.16"/>

  <!-- Verslag -->
  <rect x="230" y="186" width="182" height="104" rx="8" fill="#f5f5f5" stroke="#e5e7eb"/>
  <text x="246" y="208" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10" font-weight="800">{{ cond $nl "Het verslag erbij" "The report that comes with it" }}</text>
  <circle cx="252" cy="228" r="7" fill="#004050"/>
  <path d="M249 228 l2.5 2.5 4 -4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="266" y="232" fill="#4b5563" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "wat is opgelost" "what was fixed" }}</text>
  <circle cx="252" cy="250" r="7" fill="#A30D4B"/>
  <path d="M252 246 v4.5 M252 253.4 v0.1" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="266" y="254" fill="#4b5563" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "wat nog open staat" "what is still open" }}</text>
  <circle cx="252" cy="272" r="7" fill="#fff" stroke="#6B7280" stroke-width="1.4"/>
  <path d="M249 272 h6" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/>
  <text x="266" y="276" fill="#4b5563" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "wat wij niet draaiden" "what we did not run" }}</text>
</svg>
