{{/* Titel: documenteigenschap, niet de bestandsnaam. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfdoc-svg">
  <rect x="0.5" y="0.5" width="399" height="299" rx="12" fill="#fff" stroke="#e5e7eb"/>

  <!-- Tabbladen in een browser -->
  <text x="28" y="34" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9" font-weight="700">{{ cond $nl "IN HET TABBLAD EN IN DE SCHERMLEZER" "IN THE TAB AND IN THE SCREEN READER" }}</text>

  <rect x="28" y="46" width="172" height="34" rx="8" fill="#f5f5f5" stroke="#004050" stroke-width="1.3"/>
  <rect x="42" y="57" width="12" height="14" rx="2" fill="#004050" opacity="0.5"/>
  <text x="62" y="68" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10" font-weight="700">{{ cond $nl "Jaarverslag 2025" "Annual report 2025" }}</text>
  <circle cx="214" cy="63" r="10" fill="#004050"/>
  <path d="M209 63 l3.5 3.5 6 -7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="28" y="96" width="172" height="34" rx="8" fill="#f5f5f5" stroke="#A30D4B" stroke-width="1.3"/>
  <rect x="42" y="107" width="12" height="14" rx="2" fill="#A30D4B" opacity="0.4"/>
  <text x="62" y="118" fill="#6B7280" font-family="monospace" font-size="10">Document1.pdf</text>
  <circle cx="214" cy="113" r="10" fill="#A30D4B"/>
  <path d="M214 108.5 v5.5 M214 117.6 v0.1" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- Eigenschappenvenster -->
  <rect x="28" y="156" width="344" height="118" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <path d="M28 182 h344" stroke="#e5e7eb"/>
  <text x="46" y="175" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10" font-weight="800">{{ cond $nl "Documenteigenschappen" "Document properties" }}</text>

  <text x="46" y="208" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5" font-weight="700">{{ cond $nl "Titel" "Title" }}</text>
  <rect x="122" y="194" width="228" height="22" rx="5" fill="#fff" stroke="#004050" stroke-width="1.4"/>
  <text x="132" y="209" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10">{{ cond $nl "Jaarverslag 2025" "Annual report 2025" }}</text>

  <text x="46" y="238" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5" font-weight="700">{{ cond $nl "Auteur" "Author" }}</text>
  <rect x="122" y="224" width="228" height="22" rx="5" fill="#f5f5f5" stroke="#e5e7eb"/>
  <rect x="132" y="232" width="76" height="6" rx="3" fill="#1F2937" opacity="0.2"/>

  <text x="46" y="264" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="9.5" font-weight="700">{{ cond $nl "De bestandsnaam telt niet mee." "The file name does not count." }}</text>
</svg>
