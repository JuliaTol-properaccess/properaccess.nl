{{/* Analyse draait in de browser, het bestand gaat niet naar een server. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfdoc-svg">
  <rect x="0.5" y="0.5" width="399" height="299" rx="12" fill="#fff" stroke="#e5e7eb"/>

  <!-- Browservenster -->
  <rect x="28" y="46" width="200" height="180" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
  <path d="M28 66 h200" stroke="#e5e7eb"/>
  <circle cx="42" cy="56" r="3.5" fill="#A30D4B" opacity="0.5"/>
  <circle cx="54" cy="56" r="3.5" fill="#004050" opacity="0.35"/>
  <circle cx="66" cy="56" r="3.5" fill="#1F2937" opacity="0.2"/>
  <text x="28" y="36" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9" font-weight="700">{{ cond $nl "JOUW BROWSER" "YOUR BROWSER" }}</text>

  <!-- PDF-pagina in het venster -->
  <rect x="60" y="86" width="90" height="118" rx="6" fill="#fff" stroke="#004050" stroke-width="1.4"/>
  <path d="M126 86 v18 h24" stroke="#004050" stroke-width="1.4" fill="none"/>
  <rect x="72" y="118" width="52" height="7" rx="3.5" fill="#1F2937" opacity="0.65"/>
  <rect x="72" y="133" width="66" height="5" rx="2.5" fill="#1F2937" opacity="0.25"/>
  <rect x="72" y="145" width="66" height="5" rx="2.5" fill="#1F2937" opacity="0.25"/>
  <rect x="72" y="157" width="44" height="5" rx="2.5" fill="#1F2937" opacity="0.25"/>
  <rect x="72" y="172" width="52" height="20" rx="4" fill="#004050" opacity="0.12"/>

  <!-- Loep over de pagina -->
  <circle cx="152" cy="176" r="24" fill="#fff" fill-opacity="0.85" stroke="#A30D4B" stroke-width="2.2"/>
  <path d="M170 194 l16 16" stroke="#A30D4B" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M143 176 l6 7 12 -14" stroke="#A30D4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Pijl naar de server, doorgestreept -->
  <path d="M240 136 h58" stroke="#1F2937" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.35"/>
  <path d="M292 130 l8 6 -8 6" stroke="#1F2937" stroke-width="1.6" opacity="0.35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Server, uitgeschakeld -->
  <rect x="308" y="102" width="64" height="68" rx="8" fill="#f5f5f5" stroke="#e5e7eb"/>
  <rect x="320" y="116" width="40" height="14" rx="3" fill="#fff" stroke="#e5e7eb"/>
  <rect x="320" y="142" width="40" height="14" rx="3" fill="#fff" stroke="#e5e7eb"/>
  <circle cx="352" cy="123" r="2.4" fill="#1F2937" opacity="0.3"/>
  <circle cx="352" cy="149" r="2.4" fill="#1F2937" opacity="0.3"/>
  <circle cx="340" cy="136" r="26" stroke="#A30D4B" stroke-width="2.6" fill="none"/>
  <path d="M322 118 l36 36" stroke="#A30D4B" stroke-width="2.6" stroke-linecap="round"/>
  <text x="284" y="200" fill="#A30D4B" font-family="Nunito, sans-serif" font-size="9.5" font-weight="800">{{ cond $nl "niets verstuurd" "nothing uploaded" }}</text>

  <!-- Voetregel -->
  <rect x="28" y="244" width="344" height="30" rx="15" stroke="#004050" stroke-width="1.3" fill="none"/>
  <path d="M50 259 l5 5 10 -11" stroke="#004050" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="76" y="263" fill="#004050" font-family="Nunito, sans-serif" font-size="10.5" font-weight="700">{{ cond $nl "Je bestand blijft op je eigen computer" "Your file stays on your own computer" }}</text>
</svg>
