{{/* Taal: de ingestelde taalcode tegenover de taal van de tekst. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfdoc-svg">
  <rect x="0.5" y="0.5" width="399" height="299" rx="12" fill="#fff" stroke="#e5e7eb"/>

  <text x="28" y="34" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9" font-weight="700">{{ cond $nl "INGESTELDE TAAL" "LANGUAGE SET" }}</text>
  <text x="232" y="34" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9" font-weight="700">{{ cond $nl "TAAL VAN DE TEKST" "LANGUAGE OF THE TEXT" }}</text>

  <!-- Klopt -->
  <rect x="28" y="46" width="120" height="44" rx="8" fill="#f5f5f5" stroke="#004050" stroke-width="1.3"/>
  <text x="44" y="74" fill="#004050" font-family="monospace" font-size="13" font-weight="700">nl-NL</text>
  <path d="M158 68 h58" stroke="#004050" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="224" cy="68" r="10" fill="#004050"/>
  <path d="M219 68 l3.5 3.5 6 -7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="244" y="46" width="128" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <text x="258" y="66" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10">De gemeente stuurt</text>
  <text x="258" y="80" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10">u deze brief.</text>

  <!-- Klopt niet -->
  <rect x="28" y="112" width="120" height="44" rx="8" fill="#f5f5f5" stroke="#A30D4B" stroke-width="1.3"/>
  <text x="44" y="140" fill="#A30D4B" font-family="monospace" font-size="13" font-weight="700">nl-NL</text>
  <path d="M158 134 h58" stroke="#A30D4B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="224" cy="134" r="10" fill="#A30D4B"/>
  <path d="M220 130 l8 8 M228 130 l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <rect x="244" y="112" width="128" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <text x="258" y="132" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10" lang="en">The council sends</text>
  <text x="258" y="146" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10" lang="en">you this letter.</text>

  <!-- Uitspraak -->
  <rect x="28" y="180" width="344" height="94" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
  <circle cx="76" cy="227" r="26" fill="#fff" stroke="#004050" stroke-width="1.4"/>
  <path d="M76 212 v22" stroke="#004050" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M68 218 v10 M84 218 v10 M60 222 v2 M92 222 v2" stroke="#004050" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M64 240 h24" stroke="#004050" stroke-width="1.6" stroke-linecap="round"/>
  <text x="122" y="216" fill="#1F2937" font-family="Nunito, sans-serif" font-size="10.5" font-weight="700">{{ cond $nl "De taalcode bepaalt de stem." "The language code picks the voice." }}</text>
  <text x="122" y="234" fill="#6B7280" font-family="Nunito, sans-serif" font-size="10">{{ cond $nl "Staat er nl, maar is de tekst Engels," "If it says nl but the text is English," }}</text>
  <text x="122" y="249" fill="#6B7280" font-family="Nunito, sans-serif" font-size="10">{{ cond $nl "dan klinkt het als onzin." "it comes out as nonsense." }}</text>
</svg>
