{{/* Statusniveaus zoals ze in het resultaat verschijnen. Decoratief. */}}
{{ $nl := .nl }}
<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" class="pdfdoc-svg">
  <rect x="0.5" y="0.5" width="399" height="299" rx="12" fill="#fff" stroke="#e5e7eb"/>

  <!-- In orde -->
  <rect x="28" y="34" width="344" height="52" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <path d="M28 42 a8 8 0 0 1 8 -8 h2 v52 h-2 a8 8 0 0 1 -8 -8 z" fill="#16a34a"/>
  <circle cx="62" cy="60" r="12" fill="#16a34a"/>
  <path d="M56 60 l4.5 4.5 7.5 -8.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="88" y="56" fill="#1F2937" font-family="Nunito, sans-serif" font-size="11.5" font-weight="800">{{ cond $nl "In orde" "Passed" }}</text>
  <text x="88" y="72" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "De automatische controle vond hier niets." "The automated check found nothing here." }}</text>

  <!-- Probleem -->
  <rect x="28" y="98" width="344" height="52" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <path d="M28 106 a8 8 0 0 1 8 -8 h2 v52 h-2 a8 8 0 0 1 -8 -8 z" fill="#A30D4B"/>
  <circle cx="62" cy="124" r="12" fill="#A30D4B"/>
  <path d="M57.5 119.5 l9 9 M66.5 119.5 l-9 9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="88" y="120" fill="#1F2937" font-family="Nunito, sans-serif" font-size="11.5" font-weight="800">{{ cond $nl "Probleem" "Issue" }}</text>
  <text x="88" y="136" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "Dit moet worden opgelost." "This needs to be fixed." }}</text>

  <!-- Waarschuwing -->
  <rect x="28" y="162" width="344" height="52" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <path d="M28 170 a8 8 0 0 1 8 -8 h2 v52 h-2 a8 8 0 0 1 -8 -8 z" fill="#d97706"/>
  <circle cx="62" cy="188" r="12" fill="#d97706"/>
  <path d="M62 182 v7 M62 193.4 v0.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="88" y="184" fill="#1F2937" font-family="Nunito, sans-serif" font-size="11.5" font-weight="800">{{ cond $nl "Waarschuwing" "Warning" }}</text>
  <text x="88" y="200" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "Kijk hier zelf even naar." "Take a look at this yourself." }}</text>

  <!-- N.v.t. -->
  <rect x="28" y="226" width="344" height="52" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <path d="M28 234 a8 8 0 0 1 8 -8 h2 v52 h-2 a8 8 0 0 1 -8 -8 z" fill="#9ca3af"/>
  <circle cx="62" cy="252" r="12" fill="#9ca3af"/>
  <path d="M56 252 h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="88" y="248" fill="#1F2937" font-family="Nunito, sans-serif" font-size="11.5" font-weight="800">{{ cond $nl "N.v.t." "N/A" }}</text>
  <text x="88" y="264" fill="#6B7280" font-family="Nunito, sans-serif" font-size="9.5">{{ cond $nl "Deze controle geldt niet voor dit document." "This check does not apply to this document." }}</text>
</svg>
