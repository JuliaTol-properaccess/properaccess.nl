<!-- cookie consent -->
{{ with site.Params.cookies }}
  {{ if .enable }}
    <div id="cookie-box" class="cookie-box cookie-box-hide">
      <div class="cookie-box-teksten">
        <p class="cookie-box-text">{{ .content | markdownify }}</p>
        {{ with .content_detail }}
          <p class="cookie-box-detail">{{ . | markdownify }}</p>
        {{ end }}
      </div>
      <div class="cookie-box-buttons">
        <button
          id="cookie-accept"
          class="cookie-box-button btn btn-sm btn-primary"
          type="button">
          {{ .button_accept | default "Accepteren" }}
        </button>
        <button
          id="cookie-reject"
          class="cookie-box-button btn btn-sm btn-outline-primary"
          type="button">
          {{ .button_reject | default "Weigeren" }}
        </button>
      </div>
    </div>

    <script type="application/javascript">
      (function() {
        var cookieBox = document.getElementById('cookie-box');
        var acceptBtn = document.getElementById('cookie-accept');
        var rejectBtn = document.getElementById('cookie-reject');
        var consent = Cookies.get('cookie-consent');

        if (!consent) {
          cookieBox.classList.remove('cookie-box-hide');
        }

        acceptBtn.onclick = function () {
          Cookies.set('cookie-consent', 'accepted', { expires: {{ .expire_days }} });
          if (window.paOpenAiGrantConsent) window.paOpenAiGrantConsent();
          cookieBox.classList.add('cookie-box-hide');
        };

        rejectBtn.onclick = function () {
          Cookies.set('cookie-consent', 'rejected', { expires: {{ .expire_days }} });
          if (window.paOpenAiRevokeConsent) window.paOpenAiRevokeConsent();
          cookieBox.classList.add('cookie-box-hide');
        };
      })();
    </script>

    <style>
      /* Een smalle balk over de volle breedte onderaan. Als blok linksonder lag
         hij over de eerste vraag van het offerteformulier, en op een telefoon
         over de helft van het scherm (UX-review 9 november 2026). */
      .cookie-box {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1.5rem;
        padding: 0.75rem 1.25rem;
        background-color: #fff;
        border-top: 1px solid #E5E7EB;
        box-shadow: 0 -4px 12px rgba(154, 154, 154, 0.15);
      }
      .cookie-box-hide {
        display: none;
      }
      .cookie-box-teksten {
        flex: 1 1 32rem;
      }
      .cookie-box-buttons {
        flex: 0 0 auto;
      }
      .cookie-box-text {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.45;
      }
      .cookie-box-detail {
        margin: 0;
        font-size: 0.8rem;
        color: #6B7280;
        line-height: 1.5;
      }
      .cookie-box-detail a {
        color: #004050;
        text-decoration: underline;
      }
      .cookie-box-buttons {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .cookie-box-button {
        margin: 0;
      }
      .dark .cookie-box {
        background-color: #222;
      }
    </style>
  {{ end }}
{{ end }}
